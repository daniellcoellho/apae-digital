# Perfil de teste: banco H2 em memoria, sem Flyway (Hibernate cria o schema).
spring:
  datasource:
    url: jdbc:h2:mem:apae;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-test-secret-test-secret-32bytes!!
    access-token-ttl-minutes: 60
    refresh-token-ttl-days: 7
  cors:
    allowed-origins: http://localhost:3000
  uploads:
    # Em teste, grava num diretorio temporario do SO para nao sujar o projeto.
    dir: ${java.io.tmpdir}/apae-test-uploads
    public-path: /uploads
    max-file-size-bytes: 5242880
  seed:
    enabled: false
